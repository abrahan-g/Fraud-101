<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1b2b49">
  <title>Fraud 101</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to course content</a>
  <div id="app" class="app">
    <section id="startScreen" class="start-screen" aria-labelledby="courseTitle">
      <div class="dot-field" aria-hidden="true"></div>
      <div class="start-content">
        <h1 id="courseTitle">Fraud 101</h1>
        <button id="startBtn" class="primary-btn">Start Course <span aria-hidden="true">→</span></button>
        <button id="resumeBtn" class="text-btn hidden" hidden aria-hidden="true" tabindex="-1"></button>
      </div>
    </section>

    <section id="courseShell" class="course-shell hidden">
      <aside id="sidebar" class="sidebar" aria-label="Course navigation">
        <div class="brand-row">
          <button id="homeBtn" class="logo-btn" aria-label="Return to course start">
            <span class="home-glyph" aria-hidden="true">⌂</span>
          </button>
          <button id="collapseBtn" class="icon-btn" aria-label="Collapse lesson menu" aria-expanded="true">‹</button>
        </div>
        <div class="side-course-title">Fraud 101</div>
        <div class="progress-wrap">
          <div class="progress-copy"><span>Course progress</span><strong id="progressPercent">0%</strong></div>
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        </div>
        <nav id="lessonNav" class="lesson-nav"></nav>
        <button id="soundBtn" class="sound-btn" aria-pressed="false"><span aria-hidden="true">🔊</span><span class="sound-label">Sound on</span></button>
      </aside>

      <div class="main-wrap">
        <header class="topbar">
          <button id="mobileMenuBtn" class="mobile-menu" aria-label="Open lesson menu">☰</button>
          <div>
            <span id="lessonKicker" class="kicker"></span>
            <h2 id="lessonTitle"></h2>
          </div>
          <div id="statusPill" class="status-pill">In progress</div>
        </header>
        <main id="main" class="lesson-content" tabindex="-1"></main>
        <footer class="course-footer">
          <button id="backBtn" class="secondary-btn">← Previous</button>
          <span id="pageIndicator"></span>
          <button id="nextBtn" class="primary-btn small">Continue →</button>
        </footer>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="menuAudio" preload="auto" src="assets/menu-selection.mp3"></audio>
  <audio id="clickAudio" preload="auto" src="assets/click.mp3"></audio>
  <script src="scorm.js"></script>
  <script src="app.js"></script>
  <script src="app-v2.js"></script>
  <script src="app-v3.js"></script>
  <script src="app-v4.js"></script>
  <script src="app-v5.js"></script>
  <script src="app-v6.js"></script>
  <script src="app-v7.js"></script>
  <script src="app-v8.js"></script>
  <script src="app-v9.js"></script>
  <script src="app-v10.js"></script>
  <script src="app-v11.js"></script>
  <script src="app-v12.js"></script>
  <script src="app-v13.js"></script>
  <script src="app-v14.js"></script>
  <script src="app-v15.js"></script>
  <script src="app-v16.js"></script>
  <script src="app-v17.js"></script>
  <script src="app-v18.js"></script>
  <script src="app-v19.js"></script>
  <script src="app-v20.js"></script>
  <script src="app-v21.js"></script>
</body>
</html>
